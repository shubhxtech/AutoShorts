[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipforge"
version = "0.2.0"
description = "Automated short-video studio: licensed long videos in, ready-to-post Shorts and Reels out."
requires-python = ">=3.11"
dependencies = [
  "scipy>=1.13",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.22",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13",
  "python-dotenv>=1.0",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pillow>=12.3,<13",          # 13.x breaks on Python 3.13 (PIL._typing)
  "scenedetect>=0.6.4",
  "yt-dlp>=2024.8.1",
  "feedparser>=6.0",
  "google-api-python-client>=2.130",
  "google-auth-oauthlib>=1.2",
  # Everything below runs on-device on Apple silicon: no paid APIs.
  "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx-lm>=0.30; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "pyobjc-framework-Vision>=10; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
  "pyobjc-framework-CoreText>=10; sys_platform == 'darwin'",
  "torch>=2.2",                 # forced alignment (wav2vec2)
  "transformers>=4.40",
]

[project.optional-dependencies]
# Speaker diarization (needs a Hugging Face token and pulls in PyTorch).
diarize = ["pyannote.audio>=3.3"]
# Non-Apple transcription fallback.
cpu = ["faster-whisper>=1.0"]
# Faceless studio: local voice (Kokoro) and image generation (Z-Image-Turbo).
faceless = ["mlx-audio>=0.6", "mflux>=0.23", "misaki[en]>=0.9", "spacy>=3.8"]
# Google Drive folders shared by link.
drive = ["gdown>=5.2"]
dev = ["pytest>=8", "ruff>=0.5"]
all = ["clipforge[faceless,drive]"]

[project.scripts]
clipforge = "clipforge.cli:app"

[tool.setuptools.packages.find]
include = ["clipforge*"]

[tool.setuptools.package-data]
clipforge = ["assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
