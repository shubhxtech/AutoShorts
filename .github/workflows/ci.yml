name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and build dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.17.1"
      - run: ruff check backend
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx tsc --noEmit -p .
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libegl1 libgl1 libfontconfig1
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      # The CPU build keeps the install small; GPUs are used at runtime when present.
      - name: Install PyTorch (CPU)
        if: runner.os != 'macOS'
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install the engine
        run: pip install -e "backend[dev]"
      - name: Run tests
        working-directory: backend
        run: python -m pytest -q -rs

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t autoshorts:ci .
      - name: Start and check the engine and dashboard answer
        run: |
          docker run -d --name as -p 127.0.0.1:3000:3000 autoshorts:ci
          for i in $(seq 60); do curl -sf http://localhost:3000/api/ping && break; sleep 2; done
          curl -sf http://localhost:3000/api/ping
          curl -sf http://localhost:3000/ | grep -q '<div id="root">'
          docker logs as | tail -20
