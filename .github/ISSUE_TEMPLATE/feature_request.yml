name: Feature request
description: An idea for a new format, style, platform or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem or workflow, and why it matters to you.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Optional. Examples of videos or tools that do it well help a lot.
